# [Integrante A] Stack completo. Uso: docker compose up -d --build  (bases + REST)
#                              docker compose run --build --rm cli  (menu CLI)
# Los scripts init solo corren con volumen vacio: docker compose down -v para reiniciar datos.
services:
  # MariaDB 10.11 en :3307 (host) -> 3306 (contenedor); init con scripts/persona_*_maria.sql.
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports: ["3307:3306"]
    volumes:
      - ./scripts/persona_ddl_maria.sql:/docker-entrypoint-initdb.d/1_ddl.sql:ro
      - ./scripts/persona_dml_maria.sql:/docker-entrypoint-initdb.d/2_dml.sql:ro
      - maria_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MongoDB 6 en :27017; init con scripts/persona_*_mongo.js.
  mongo:
    image: mongo:6
    ports: ["27017:27017"]
    volumes:
      - ./scripts/persona_ddl_mongo.js:/docker-entrypoint-initdb.d/1_ddl.js:ro
      - ./scripts/persona_dml_mongo.js:/docker-entrypoint-initdb.d/2_dml.js:ro
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # API REST en :3000. Espera a que ambas bases esten healthy; restart por si arranca antes de tiempo.
  rest:
    build:
      context: .
      args: { MODULE: rest-input-adapter }
    ports: ["3000:3000"]
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/persona_db
      SPRING_DATA_MONGODB_HOST: mongo
    depends_on:
      mariadb: { condition: service_healthy }
      mongo: { condition: service_healthy }

  # CLI interactivo: solo arranca con el profile "cli" (docker compose run).
  cli:
    build:
      context: .
      args: { MODULE: cli-input-adapter }
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/persona_db
      SPRING_DATA_MONGODB_HOST: mongo
    stdin_open: true
    tty: true
    profiles: ["cli"]
    depends_on:
      mariadb: { condition: service_healthy }
      mongo: { condition: service_healthy }

volumes:
  maria_data:
  mongo_data:
