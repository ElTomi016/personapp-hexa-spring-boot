services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports: ["3307:3306"]
    volumes:
      - ./scripts/persona_ddl_maria.sql:/docker-entrypoint-initdb.d/1_ddl.sql:ro
      - ./scripts/persona_dml_maria.sql:/docker-entrypoint-initdb.d/2_dml.sql:ro
      - maria_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:6
    ports: ["27017:27017"]
    volumes:
      - ./scripts/persona_ddl_mongo.js:/docker-entrypoint-initdb.d/1_ddl.js:ro
      - ./scripts/persona_dml_mongo.js:/docker-entrypoint-initdb.d/2_dml.js:ro
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    build:
      context: .
      args: { MODULE: rest-input-adapter }
    ports: ["3000:3000"]
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/persona_db
      SPRING_DATA_MONGODB_HOST: mongo
    depends_on:
      mariadb: { condition: service_healthy }
      mongo: { condition: service_healthy }

  cli:
    build:
      context: .
      args: { MODULE: cli-input-adapter }
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/persona_db
      SPRING_DATA_MONGODB_HOST: mongo
    stdin_open: true
    tty: true
    profiles: ["cli"]
    depends_on:
      mariadb: { condition: service_healthy }
      mongo: { condition: service_healthy }

volumes:
  maria_data:
  mongo_data:
